name: Index

on:
  workflow_dispatch:
  workflow_call:

permissions:
  packages: read
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so origin/main exists -- a shallow checkout only has
      # this branch, and dockerfile-commits reads main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Built from the repo, not from /orgs/{org}/packages: that endpoint
      # rejects GITHUB_TOKEN (HTTP 400), which is why the README claimed
      # "No packages published yet" for six months. bin/dockerfile-commits
      # lists exactly what build.yml pushes, so it is the same source of truth.
      - name: List images from main
        run: |
          ./bin/dockerfile-commits origin/main \
            | awk '{print $2"|"$3",latest"}' \
            | sort > packages.dat
          echo "Wrote $(wc -l < packages.dat) packages to packages.dat"

      - name: Render README.md
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          ./bin/render-index
          rm -f packages.dat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update image index"
            git push
          else
            echo "README unchanged, skipping commit"
          fi
