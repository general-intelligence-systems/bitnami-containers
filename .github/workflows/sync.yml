name: Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No `|| true` here: a swallowed failure is how main silently froze at
          # 2026-04-17 while every nightly run still reported green.
          gh api -X POST /repos/${{ github.repository }}/merge-upstream -f branch=main

  build:
    needs: sync
    uses: ./.github/workflows/build.yml
    with:
      build_all: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      packages: write
      contents: write
